# ─────────────────────────────────────────────────────────────
# Jekyll configuration
#
# GitHub Pages builds this repo with its own Jekyll and its own
# allowed-plugin list, so nothing here may depend on a gem Pages
# does not already ship. There are no plugins for that reason.
#
# Pages (about, privacy, terms, thanks) carry their own
# `permalink:` to the extension-less form (/about/, /privacy/, …),
# matching the blog's URL style. Each also sets `redirect_from:`
# to its old .html path, so jekyll-redirect-from generates a static
# stub at that old path — anything that still links to
# /privacy.html (an old bookmark, a search result) lands on a page
# that redirects rather than a 404.
# ─────────────────────────────────────────────────────────────

title:       Asset Signal
description: The decision layer for real estate asset management.
url:         https://assetsignal.ai
baseurl:     ""
email:       service@assetsignal.ai
lang:        en

# PostHog analytics — public client-side token (safe to commit).
# Set these from POSTHOG_PROJECT_TOKEN and POSTHOG_HOST in your .env
# for local reference; GitHub Pages uses these values directly.
posthog_key:  phc_rD5j263C2a9AnKZaaVNs7BxcQKSpqDLUc2meeaJ65T7w
posthog_host: https://us.i.posthog.com

# Both are on GitHub Pages' allowlist, so they run on the deployed
# build without a custom Actions workflow. jekyll-feed publishes
# /feed.xml for the blog; jekyll-sitemap publishes /sitemap.xml,
# which matters now that the site is more than one page.
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

feed:
  path: feed.xml

# Sass/coffee are off; the CSS in css/ is hand-written and is
# copied verbatim. Nothing in this project is compiled.
sass:
  style: expanded

# Source material and local tooling. reference/ holds the brand
# decks and layered artwork — this repo is public, so they are
# excluded from the build as well as from git.
exclude:
  - README.md
  - reference/
  - .agents/
  - .impeccable/
  - skills-lock.json
  - Gemfile
  - Gemfile.lock
  - vendor/

# Posts render at /blog/<slug>/ rather than by date. A pre-launch
# company publishes rarely, and a 2026/08/21 in the URL dates a
# piece that may be the only one for a month.
#
# This is set under defaults, NOT as a top-level `permalink:`. A
# top-level permalink applies to PAGES as well as posts: it turned
# privacy.html into /privacy/ and 404'd the published /privacy.html
# that the demo form's consent line links to.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:slug/
      styles: [sections, footer, blog]
      og: true
      og_type: article
